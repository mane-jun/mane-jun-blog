name: Retrospective reminder

# 매일 22:00 KST: 오늘 일간회고가 없거나 초안이면 이슈를 만들어 mane-jun에게 지정한다(GitHub 앱 푸시 알림).
# 일요일에는 이번 주 주간회고와 지난달 월간회고도 확인한다. 회고를 공개해 push하면 해당 알림 이슈를 닫는다.
# 수동 실행 때 date를 주면 그 날짜 22:00 KST로, kind를 주면 그 회고만 확인한다(테스트용).
# 판단은 scripts/retro-reminder.mjs, 이슈 처리는 scripts/retro-reminder.sh.
on:
  schedule:
    - cron: "0 13 * * *"
  push:
    branches:
      - main
    paths:
      - "content/posts/**"
  workflow_dispatch:
    inputs:
      date:
        description: "확인할 날짜 (YYYY-MM-DD, 비우면 오늘 KST)"
        required: false
      kind:
        description: "확인할 회고 (auto: 일간 + 일요일이면 주간·월간)"
        type: choice
        options:
          - auto
          - daily
          - weekly
          - monthly
        default: auto

permissions:
  contents: read
  issues: write

concurrency:
  group: retro-reminder
  cancel-in-progress: false

env:
  LABEL: 회고 알림
  ASSIGNEE: mane-jun
  ADMIN_URL: https://mane-jun.github.io/mane-jun-blog/admin/
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}
  RETRO_DATE: ${{ github.event.inputs.date }}

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Close reminders for published retrospectives
        if: github.event_name == 'push'
        run: |
          for kind in daily weekly monthly; do
            bash scripts/retro-reminder.sh "$kind" close
          done

      - name: Remind
        if: github.event_name != 'push'
        env:
          KIND: ${{ github.event.inputs.kind || 'auto' }}
        run: |
          gh label create "$LABEL" --color FBCA04 --description "회고 알림" --force
          if [ "$KIND" = "auto" ]; then
            kinds="$(node scripts/retro-reminder.mjs --due)"
          else
            kinds="$KIND"
          fi
          for kind in $kinds; do
            bash scripts/retro-reminder.sh "$kind" remind
          done
