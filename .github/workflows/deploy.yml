name: Deploy Hugo site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  # 예약 발행: 매시 7분에 작성일이 지났는데 아직 사이트에 없는 글이 있는지 확인하고, 있을 때만 배포한다.
  schedule:
    - cron: "7 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  scheduled:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.check.outputs.deploy }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for posts that are due but not live
        id: check
        run: node scripts/scheduled-posts.mjs

  build:
    needs: scheduled
    # push·수동 실행은 항상, 예약 확인은 올릴 글이 있을 때만 빌드한다.
    if: ${{ !cancelled() && (github.event_name != 'schedule' || needs.scheduled.outputs.deploy == 'true') }}
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.164.0
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      # 본문 사진 변환 결과(WebP)를 다음 빌드에 재사용해 사진이 많아져도 빌드가 느려지지 않게 한다.
      - name: Cache processed images
        uses: actions/cache@v4
        with:
          path: resources/_gen
          key: hugo-resources-${{ github.sha }}
          restore-keys: hugo-resources-

      # Hugo가 Git 기록에서 한글 파일명 글의 수정일을 찾을 수 있게, Git이 경로를 ì… 같은 코드 대신 그대로 출력하게 한다.
      - name: Keep non-ASCII paths readable for Hugo's Git info
        run: git config core.quotepath false

      - name: Build with Hugo
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: |
          hugo \
            --gc \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"

      # 사이트 안쪽 링크·이미지 주소가 깨졌으면 배포하지 않는다 (scripts/check-links.mjs).
      - name: Check internal links
        run: node scripts/check-links.mjs public

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
