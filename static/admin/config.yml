backend:
  name: github
  repo: mane-jun/mane-jun-blog
  branch: main
  base_url: https://mane-jun-blog-oauth.kimleo-study.workers.dev
  auth_endpoint: auth
  auth_scope: public_repo

site_url: https://mane-jun.github.io/mane-jun-blog/
display_url: https://mane-jun.github.io/mane-jun-blog/
locale: ko

slug:
  encoding: unicode
  clean_accents: false
  sanitize_replacement: "-"

media_folder: static/images/uploads
public_folder: /mane-jun-blog/images/uploads

collections:
  - name: posts
    label: 글
    label_singular: 글
    folder: content/posts
    create: true
    path: "{{slug}}/index"
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    media_folder: ""
    public_folder: ""
    # 목록 한 줄: "제목 · 2026-09-21 · #태그1 #태그2 #태그3" (태그가 4개 이상이면 뒤에 …)
    summary: "{{title}} · {{date | date('YYYY-MM-DD')}}{{fields.tags.0 | ternary(' · #', '')}}{{fields.tags.0}}{{fields.tags.1 | ternary(' #', '')}}{{fields.tags.1}}{{fields.tags.2 | ternary(' #', '')}}{{fields.tags.2}}{{fields.tags.3 | ternary(' …', '')}}"
    sortable_fields:
      - { field: date, default_sort: desc }
      - title
      - draft
    view_filters:
      - { label: 초안, field: draft, pattern: true }
      - { label: 공개, field: draft, pattern: false }
    fields:
      - { label: 제목, name: title, widget: string }
      - label: 작성일
        name: date
        widget: datetime
        default: "{{now}}"
        format: "YYYY-MM-DDTHH:mm:ssZ"
      - { label: 초안, name: draft, widget: boolean, default: true }
      - label: 카테고리
        name: categories
        widget: select
        multiple: true
        options: [개발, 회고, 생각, 기타]
        default: [기타]
      - { label: 태그, name: tags, widget: list, required: false }
      - { label: 요약, name: summary, widget: text, required: false }
      - { label: 본문, name: body, widget: markdown }
