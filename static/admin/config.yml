backend:
  name: github
  repo: mane-jun/mane-jun-blog
  branch: main
  base_url: https://mane-jun-blog-oauth.kimleo-study.workers.dev
  auth_endpoint: auth
  auth_scope: public_repo

site_url: https://mane-jun.github.io/mane-jun-blog/
display_url: https://mane-jun.github.io/mane-jun-blog/
locale: ko

slug:
  encoding: unicode
  clean_accents: false
  sanitize_replacement: "-"

media_folder: static/images/uploads
public_folder: /mane-jun-blog/images/uploads

collections:
  - name: posts
    label: 글
    label_singular: 글
    folder: content/posts
    create: true
    path: "{{slug}}/index"
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    media_folder: ""
    public_folder: ""
    # 목록 한 줄: "[게시됨] 제목 · 2026-09-21 · #태그1 #태그2 #태그3" (태그가 4개 이상이면 뒤에 …)
    summary: &list_summary "{{draft | ternary('[초안]', '[게시됨]')}} {{title}} · {{date | date('YYYY-MM-DD')}}{{fields.tags.0 | ternary(' · #', '')}}{{fields.tags.0}}{{fields.tags.1 | ternary(' #', '')}}{{fields.tags.1}}{{fields.tags.2 | ternary(' #', '')}}{{fields.tags.2}}{{fields.tags.3 | ternary(' …', '')}}"
    sortable_fields: &sortable_fields
      - { field: date, default_sort: desc }
      - title
      - draft
    view_filters: &view_filters
      - { label: 초안, field: draft, pattern: true }
      - { label: 공개, field: draft, pattern: false }
    fields:
      - &title_field { label: 제목, name: title, widget: string }
      - &date_field
        label: 작성일
        name: date
        widget: datetime
        default: "{{now}}"
        format: "YYYY-MM-DDTHH:mm:ssZ"
      - &draft_field { label: 초안, name: draft, widget: boolean, default: true }
      - label: 카테고리
        name: categories
        widget: select
        multiple: true
        options: &category_options [개발, 회고, 생각, 기타]
        default: [기타]
      - { label: 태그, name: tags, widget: list, required: false }
      - &summary_field { label: 요약, name: summary, widget: text, required: false }
      - { label: 본문, name: body, widget: markdown }

  # 회고 전용 컬렉션: 같은 글 폴더를 태그로 걸러 보여주고, 새 글을 양식으로 채운다.
  # 본문 기본값은 저장소 루트의 일간·주간·월간회고_양식.md 본문과 같아야 한다(tests/cms-config.test.js).
  # 새 글 제목은 static/admin/retro-title.js가 채운다. 폴더명은 제목을 따른다(예: 2026-09-21-일간회고).
  - name: daily
    label: 일간회고
    label_singular: 일간회고
    folder: content/posts
    create: true
    path: "{{slug}}/index"
    slug: "{{slug}}"
    filter: { field: tags, value: 일간회고 }
    media_folder: ""
    public_folder: ""
    summary: *list_summary
    sortable_fields: *sortable_fields
    view_filters: *view_filters
    fields:
      - *title_field
      - *date_field
      - *draft_field
      - label: 카테고리
        name: categories
        widget: select
        multiple: true
        options: *category_options
        default: [회고]
      - { label: 태그, name: tags, widget: list, required: false, default: [일간회고, 일상] }
      - *summary_field
      - label: 본문
        name: body
        widget: markdown
        default: |
          ## 오늘 체크
          - 컨디션: /5
          - 운동: O / X

          ## 오늘 한 줄

          ## 오늘 한 일
          - 학교:
          - 프로젝트:
          - 루틴:

          ## 잘한 것 하나

          ## 아쉬운 것 하나 → 내일은 이렇게

          ## 내일 가장 중요한 한 가지

  - name: weekly
    label: 주간회고
    label_singular: 주간회고
    folder: content/posts
    create: true
    path: "{{slug}}/index"
    slug: "{{slug}}"
    filter: { field: tags, value: 주간회고 }
    media_folder: ""
    public_folder: ""
    summary: *list_summary
    sortable_fields: *sortable_fields
    view_filters: *view_filters
    fields:
      - *title_field
      - *date_field
      - *draft_field
      - label: 카테고리
        name: categories
        widget: select
        multiple: true
        options: *category_options
        default: [회고]
      - { label: 태그, name: tags, widget: list, required: false, default: [주간회고, 일상] }
      - *summary_field
      - label: 본문
        name: body
        widget: markdown
        default: |
          ## 이번 주 숫자
          - 회고 쓴 날: /7
          - 운동한 날: /7
          - 컨디션: 월  화  수  목  금  토  일  (평균 )

          ## 지난주 목표 점검
          - 학교: 달성 / 부분 / 미달 — 이유
          - 프로젝트:
          - 루틴:

          ## 컨디션 흐름
          - 가장 좋았던 날과 이유:
          - 가장 처졌던 날과 이유:

          ## 습관 점검
          - 회고를 못 쓴 날이 있었다면 왜? 다음 주엔 어떻게?

          ## 다음 주 목표 (영역별 1개)
          - 학교:
          - 프로젝트:
          - 루틴:

  - name: monthly
    label: 월간회고
    label_singular: 월간회고
    folder: content/posts
    create: true
    path: "{{slug}}/index"
    slug: "{{slug}}"
    filter: { field: tags, value: 월간회고 }
    media_folder: ""
    public_folder: ""
    summary: *list_summary
    sortable_fields: *sortable_fields
    view_filters: *view_filters
    fields:
      - *title_field
      - *date_field
      - *draft_field
      - label: 카테고리
        name: categories
        widget: select
        multiple: true
        options: *category_options
        default: [회고]
      - { label: 태그, name: tags, widget: list, required: false, default: [월간회고, 일상] }
      - *summary_field
      - label: 본문
        name: body
        widget: markdown
        default: |
          ## 이번 달 숫자
          - 회고 쓴 날: /   · 운동한 날: /
          - 주별 평균 컨디션: 1주  2주  3주  4주  5주

          ## 이번 달 목표 점검
          - 학교: 달성 / 부분 / 미달 — 이유
          - 프로젝트:
          - 루틴:

          ## 컨디션 흐름에서 보인 것
          - 좋았던 시기의 공통점:
          - 처졌던 시기의 공통점:

          ## 이번 달 가장 잘한 일

          ## 유지 / 그만 / 시도
          - 유지할 것:
          - 그만할 것:
          - 새로 시도할 것:

