<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>mane-jun's log 관리자</title>
    <style>
      #analytics-link {
        position: fixed;
        right: 20px;
        bottom: 20px;
        z-index: 1000;
        padding: 10px 16px;
        border-radius: 999px;
        background: #313d3e;
        color: #fff;
        font: 600 14px/1 system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
        text-decoration: none;
        box-shadow: 0 2px 8px rgb(0 0 0 / 25%);
      }
      #analytics-link:hover,
      #analytics-link:focus-visible {
        background: #1e2728;
      }
      #analytics-link[hidden] {
        display: none;
      }
    </style>
    <link rel="stylesheet" href="editor-mobile.css" />
  </head>
  <body>
    <a id="analytics-link" href="stats.html">방문 통계</a>
    <button id="preview-toggle" type="button" aria-pressed="false">미리보기</button>
    <script>
      // Hide the analytics shortcut while editing an entry so it never covers the editor.
      const analyticsLink = document.getElementById('analytics-link');
      const syncAnalyticsLink = () => {
        analyticsLink.hidden = /\/(entries|new)\b/u.test(location.hash);
      };
      window.addEventListener('hashchange', syncAnalyticsLink);
      syncAnalyticsLink();

      // On a phone the editor shows either the fields or the preview (editor-mobile.css); this button switches between them.
      // Decap renders the preview only while its own preview toggle is on, and that toggle is hidden on phones, so turn it on.
      if (matchMedia('(max-width: 799px)').matches) localStorage.removeItem('cms.preview-visible');
      const previewToggle = document.getElementById('preview-toggle');
      const showPreview = (visible) => {
        document.body.classList.toggle('admin-show-preview', visible);
        previewToggle.setAttribute('aria-pressed', String(visible));
        previewToggle.textContent = visible ? '편집' : '미리보기';
      };
      previewToggle.addEventListener('click', () => showPreview(!document.body.classList.contains('admin-show-preview')));
      // Every entry opens on the fields.
      window.addEventListener('hashchange', () => showPreview(false));
    </script>
    <!-- decap-cms 3.15.1 with an Android Hangul input fix, built by scripts/patch-decap.mjs -->
    <script src="decap-cms.js"></script>
    <script src="preview.js"></script>
    <script type="module">
      import { installRetroTitle } from './retro-title.js';
      installRetroTitle();
    </script>
  </body>
</html>
